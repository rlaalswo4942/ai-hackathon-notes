<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#5b5bd6">
<meta name="robots" content="noindex, nofollow">
<title>공부노트</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="side-head"><b>📚 목차</b><button class="icon-btn" id="side-close" title="목차 닫기">✕</button></div>
    <nav id="side-nav"></nav>
    <div class="side-foot">
      <span id="sync-state"></span>
      <button id="btn-export" title="필기·체크를 파일로 저장 (다른 기기로 옮길 때)">💾 백업 저장</button>
      <button id="btn-import" title="백업 파일에서 필기·체크 불러오기">📂 백업 불러오기</button>
      <input type="file" id="file-import" accept=".json,application/json" hidden>
    </div>
  </aside>
  <div id="center">
    <header id="topbar">
      <button class="icon-btn" id="side-toggle" title="목차 열기/닫기">☰</button>
      <div class="crumb" id="crumb"></div>
      <button class="icon-btn" onclick="location.hash='#home'" title="홈">🏠</button>
    </header>
    <main id="main"></main>
  </div>
</div>
<div id="lightbox"><button class="x">✕</button><img alt=""></div>
<div id="toast"></div>

<script src="js/content.js"></script>
<script src="js/store.js"></script>
<script src="js/draw.js"></script>
<script src="js/app.js"></script>
</body>
</html>
